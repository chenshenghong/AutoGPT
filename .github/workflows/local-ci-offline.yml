run-name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.actor == 'chenshenghong' && github.triggering_actor == 'chenshenghong' && github.run_attempt == 1 && vars.CI_LOCAL_ENABLED == 'true' && format('AI PR {0} {1} {2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || format('Hosted CI {0} {1}', github.event_name, github.run_id) }}
name: Offline AutoGPT spinner checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci_local_source:
    name: Local CI Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ci_local_binding.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind local CI source
        id: ci_local_binding
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$sha" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
            parents=$(git cat-file -p HEAD | awk '/^$/{exit} /^parent /{print $2}' | paste -sd ' ' -)
            test "$parents" = "$EXPECTED_BASE $EXPECTED_HEAD"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  ci_local_gate:
    name: Local CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [ci_local_source, offline-spinner]
    steps:
      - name: Require local CI results
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_RESULT: ${{ needs.ci_local_source.result }}
          TARGET_RESULT: ${{ needs.offline-spinner.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$TARGET_RESULT" = success

  offline-spinner:
    needs: [ci_local_source]
    name: Run offline spinner tests
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.actor == 'chenshenghong' && github.triggering_actor == 'chenshenghong' && github.run_attempt == 1 && vars.CI_LOCAL_ENABLED == 'true' && format('ci-ai-r{0}-{1}-{2}-scripts', github.repository_id, github.run_id, github.run_attempt) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind local CI source
        id: ci_local_binding
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          DETECT_SHA: ${{ needs.ci_local_source.outputs.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$sha" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
            parents=$(git cat-file -p HEAD | awk '/^$/{exit} /^parent /{print $2}' | paste -sd ' ' -)
            test "$parents" = "$EXPECTED_BASE $EXPECTED_HEAD"
          fi
          [[ "$DETECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$sha" = "$DETECT_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Run existing spinner tests
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          mkdir -p "$workspace/autogpt/app"
          git show HEAD:autogpt/autogpt/app/spinner.py > "$workspace/autogpt/app/spinner.py"
          git show HEAD:autogpt/tests/unit/test_spinner.py > "$workspace/test_spinner.py"
          cd "$workspace"
          env -u PYTHONPATH -u PYTHONOPTIMIZE python3 -B -S - <<'PY'
          from unittest import FunctionTestCase, TestSuite, TextTestRunner
          import test_spinner

          names = sorted(name for name in vars(test_spinner) if name.startswith("test_"))
          if not names:
              raise SystemExit("No spinner tests discovered")
          suite = TestSuite(FunctionTestCase(getattr(test_spinner, name)) for name in names)
          raise SystemExit(not TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PY
